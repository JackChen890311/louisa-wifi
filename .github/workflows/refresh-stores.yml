# Weekly: re-scrape Louisa's store list. If it changed, commit it and ship a patch
# release, which the app picks up through its update check.
name: Refresh stores

on:
  schedule:
    - cron: "0 2 * * 1"  # Mondays 10:00 Taiwan time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - run: python3 scripts/fetch_stores.py
      - id: tag
        run: |
          git diff --quiet data/stores.json && exit 0
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
          IFS=. read -r major minor patch <<< "${last#v}"
          tag="v$major.$minor.$((patch + 1))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update store data"
          git tag "$tag"
          git push origin HEAD "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: refresh
    if: needs.refresh.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.refresh.outputs.tag }}
