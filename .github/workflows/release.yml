name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  # Manual entry point for backfilling a tag whose release failed or was never
  # built (e.g. v1.1.5–v1.1.7). Use it instead of re-running the whole refresh.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v1.1.7)"
        type: string
        required: true

permissions:
  contents: write

# One release per tag at a time. Re-runs wait rather than cancel a build that is
# already uploading assets.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a tag like v1.2.3, got '$TAG'"
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - run: VERSION="${TAG#v}" ./build.sh
      - run: (cd build && shasum -a 256 LouisaWiFi.zip > LouisaWiFi.zip.sha256)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(build/LouisaWiFi.zip build/LouisaWiFi.zip.sha256 raycast/louisa-wifi.js)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run or backfill: keep the release, refresh its assets.
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --generate-notes --verify-tag
          fi
